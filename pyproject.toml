[project]
name = "hotel-study"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["typer", "apify-client", "psycopg[binary]>=3", "pandas", "rapidfuzz", "pyyaml", "python-dotenv", "pytest"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hotel_study"]

[tool.pytest.ini_options]
testpaths = ["tests"]
