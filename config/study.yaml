# All study parameters (PRD section 2). Read at runtime; never hard-code.
seed: 42
star_classes: [3, 4, 5]
review_window: {start: "2023-01-01", end: "2025-12-31"}
languages: [en, id]
prescreen: {num_reviews_ge: 100}
eligibility: {threshold: 100}
ceiling: 30
eligibility_test_size: 3
reviews_per_hotel: 300
google: {top_results: 3, hl: en, gl: id, fetch_details: false, queries_per_run: 50,
         query_forms: [plain, name_only, prefixed], query_prefix: "hotels in ",
         usage_poll_seconds: 3, usage_max_wait_seconds: 60, usage_zero_item_wait_seconds: 10}
name_match: {accept: 90, uncertain: 75}
review_locale: id       # TripAdvisor domain for reviews; without it Indonesian reviews come back as English MACHINE translations
batch_size: 10
concurrency: 1
target_raw_reviews_per_hotel: 600   # PRD: about 600 raw reviews per hotel; used only to suggest end_page
rate_min_pages: 10   # only hotels with at least this many pages enter the reviews-per-page estimate
end_page: null          # set by hand after the eligibility test
max_spend_usd: 85
delete_remote_datasets: true
pilot_size: 100
pilot_min_id: 20
pilot_max_per_hotel: 4   # PRD/OSF say 2; raised for the early 27-hotel pilot (logged deviation)
google_prescreen_only: true
subrating_labels:   # ratingLabel text per subrating column (locale en and id), matched case-insensitively
  value: [Value, Nilai]
  rooms: [Rooms, Kamar]
  location: [Location, Lokasi]
  cleanliness: [Cleanliness, Kebersihan]
  service: [Service, Layanan]
  sleep_quality: [Sleep Quality, Kualitas Tidur]
