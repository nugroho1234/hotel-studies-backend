# All study parameters (PRD section 2). Read at runtime; never hard-code.
seed: 42
star_classes: [3, 4, 5]
review_window: {start: "2023-01-01", end: "2025-12-31"}
languages: [en, id]
prescreen: {num_reviews_ge: 100}
eligibility: {threshold: 100}
ceiling: 30
eligibility_test_size: 3
reviews_per_hotel: 300
google: {top_results: 3, hl: en, gl: id, fetch_details: false, queries_per_run: 50,
         query_forms: [plain, name_only, prefixed], query_prefix: "hotels in ",
         usage_poll_seconds: 3, usage_max_wait_seconds: 60, usage_zero_item_wait_seconds: 10}
name_match: {accept: 90, uncertain: 75}
review_locale: id       # TripAdvisor domain for reviews; without it Indonesian reviews come back as English MACHINE translations
batch_size: 10
no_endpage_batch_size: 3   # runs without endPage fetch full history (expensive): keep batches small (pass 2, undecided re-scrapes)
concurrency: 1
target_raw_reviews_per_hotel: 600   # PRD: about 600 raw reviews per hotel; used only to suggest end_page
rate_min_pages: 10   # only hotels with at least this many pages enter the reviews-per-page estimate
end_page: 41          # owner decision 2026-11-20: suggested by report --eligibility-test (about 600 raw reviews per hotel at 14.9 per page)
max_spend_usd: 90   # owner raised from 85 on 2026-11-20 (Bali run)
delete_remote_datasets: true
pilot_size: 100
pilot_min_id: 20
pilot_max_per_hotel: 2   # registered value (PRD/OSF); the early-pilot cap of 4 was dropped when the owner chose to wait for the main pass
google_prescreen_only: true
# Papers 2-3 flags: all false keeps the pipeline exactly as preregistered for Paper 1
allow_extended_collection: false   # gates stays after 2025-12-31, >300 reviews/hotel, hotels beyond the ceiling, incremental runs
allow_price_collection: false      # gates scheduled monthly price runs (test mode with 3-5 hotels is allowed)
run_rating_feasibility: false      # gates rating-based feasibility measures on Paper 1 hotels
min_reviews_per_window: 30
prices:
  max_spend_usd: 10
  currency: USD
  weekend_checkin_weekdays: [4, 5]   # Mon=0; Friday and Saturday check-in = weekend
  schedule: {start: "2026-12-01", end: "2027-12-01", day_of_month: 1}
validation: {dev_size: 70, test_size: 130}
subrating_labels:   # ratingLabel text per subrating column (locale en and id), matched case-insensitively
  value: [Value, Nilai]
  rooms: [Rooms, Kamar]
  location: [Location, Lokasi]
  cleanliness: [Cleanliness, Kebersihan]
  service: [Service, Layanan]
  sleep_quality: [Sleep Quality, Kualitas Tidur]
